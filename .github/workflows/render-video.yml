name: Générer la publicité Henri (MP4)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Générer le MP4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Installer les dépendances système de Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 fonts-liberation

      - name: Générer la vidéo
        run: npm run render

      - name: Rendre le MP4 téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: Henri-Promo-MP4
          path: out/henri-promo.mp4
          if-no-files-found: error
          retention-days: 30
